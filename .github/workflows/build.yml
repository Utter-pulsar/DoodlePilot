name: build

# Push a version tag (e.g. v0.1.0) → builds Windows + macOS (Intel & Apple Silicon) +
# Linux installers in the cloud and publishes them to a GitHub Release for that tag.
# GitHub's macos runner is a real Mac, so the .dmg is produced without owning one.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build bundles
        run: npm run build

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (macOS — Intel x64 + Apple Silicon arm64)
        if: matrix.os == 'macos-latest'
        # arches come from electron-builder.yml (arm64 + x64). Unsigned build; to
        # sign + notarize, add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID /
        # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID repo secrets and pass via env:.
        run: npx electron-builder --mac --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: doodlepilot-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  # Collect every OS's installers and attach them to one GitHub Release for the tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
