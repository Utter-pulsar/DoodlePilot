<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 'unsafe-eval' is required by PixiJS (it generates batching/shader code via new Function). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://fonts.googleapis.com https://fonts.gstatic.com ws: http://localhost:*;"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <title>DoodlePilot Overlay</title>
    <style>
      @font-face {
        font-family: 'Excalifont';
        src: url('/fonts/Excalifont-Regular.woff2') format('woff2');
        font-display: swap;
      }
      @font-face {
        font-family: 'Xiaolai';
        src: url('/fonts/Xiaolai-Regular.ttf') format('truetype');
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent; /* the desktop shows through */
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
